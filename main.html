    <!-- ==========================================
         BUS RESULT POSITION FIX
         
         This fixes the problem where FISAT,
         Angamaly etc. overlap the route image.
         ========================================== -->

    <style>

        /* ------------------------------------------
           BUS RESULT CARD
           ------------------------------------------ */

        .Buses .bus-list {

            position: relative;

            overflow: hidden;

        }


        /* ------------------------------------------
           ROUTE IMAGE
           ------------------------------------------ */

        .Buses .bus-list img {

            position: relative;

            z-index: 1;

        }


        /* ------------------------------------------
           FROM LOCATION
           
           Move the place name slightly ABOVE
           the route graphic.
           ------------------------------------------ */

        .Buses .bus-list .from {

            position: relative;

            z-index: 5;

            transform: translateY(-14px);

        }


        /* ------------------------------------------
           TO LOCATION
           
           Move destination slightly ABOVE
           the route graphic.
           ------------------------------------------ */

        .Buses .bus-list .to {

            position: relative;

            z-index: 5;

            transform: translateY(-14px);

        }


        /* ------------------------------------------
           PLACE NAME
           ------------------------------------------ */

        .Buses .bus-list .from h5,
        .Buses .bus-list .to h5 {

            position: relative;

            z-index: 6;

            margin-top: 0;

            margin-bottom: 5px;

        }


        /* ------------------------------------------
           TIME
           ------------------------------------------ */

        .Buses .bus-list .from h6,
        .Buses .bus-list .to h6 {

            position: relative;

            z-index: 6;

        }


        /* ------------------------------------------
           BUS NAME
           ------------------------------------------ */

        .Buses .bus-list .bus-name {

            position: relative;

            z-index: 5;

        }


        /* ------------------------------------------
           BUTTON
           ------------------------------------------ */

        .Buses .bus-list button {

            position: relative;

            z-index: 7;

        }


        /* ==========================================
           TABLET
           ========================================== */

        @media (max-width: 900px) {

            .Buses .bus-list .from,
            .Buses .bus-list .to {

                transform: translateY(-10px);

            }

        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 768px) {

            .Buses .bus-list {

                min-width: 600px;

            }


            .Buses .bus-list .from,
            .Buses .bus-list .to {

                transform: translateY(-12px);

            }

        }


        /* ==========================================
           SMALL MOBILE
           ========================================== */

        @media (max-width: 480px) {

            .Buses .bus-list .from,
            .Buses .bus-list .to {

                transform: translateY(-8px);

            }

        }

    </style>

    <!-- ==========================================
         MOBILE MENU
         ========================================== -->

    <script>


        const menuIcon =
            document.getElementById('menu-icon');


        const navLinks =
            document.getElementById('nav-links');



        /* ------------------------------------------
           OPEN / CLOSE MOBILE MENU
           ------------------------------------------ */

        menuIcon.addEventListener(
            'click',
            () => {

                navLinks.classList.toggle('active');

                menuIcon.classList.toggle('open');

            }
        );



        /* ------------------------------------------
           CLOSE MENU WHEN CLICKING OUTSIDE
           ------------------------------------------ */

        document.addEventListener(
            'click',
            (event) => {


                if (

                    !menuIcon.contains(event.target) &&

                    !navLinks.contains(event.target)

                ) {


                    navLinks.classList.remove('active');

                    menuIcon.classList.remove('open');


                }

            }
        );


    </script>
